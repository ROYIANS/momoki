[package]
name = "momoki"
version = "0.1.7"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
name = "momoki_native_storage"

[[bin]]
name = "workspace_probe"
path = "src/bin/workspace_probe.rs"
required-features = ["test-hooks"]

[[bin]]
name = "product_store_probe"
path = "src/bin/product_store_probe.rs"
required-features = ["test-hooks"]

[features]
default = []
test-hooks = []
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-http", "dep:tauri-plugin-opener", "dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit", "dep:objc2-web-kit"]
acceptance = ["desktop"]
product-sqlite = ["desktop"]

[[bin]]
name = "momoki"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client", "auth", "reqwest"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "time", "sync"] }
tokio-util = { version = "=0.7.20", features = ["codec", "io", "rt"] }
futures = "=0.3.34"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
keyring-core = "=1.0.1"
async-trait = "=0.1.92"
base64 = "=0.22.1"
http = "=1.5.0"
sse-stream = "=0.2.6"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "backup"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
tauri = { version = "=2.12.2", optional = true , features = ["tray-icon"] }
tauri-plugin-dialog = { version = "=2.8.1", optional = true }
tauri-plugin-http = { version = "=2.8.2", optional = true, default-features = false, features = ["rustls-tls", "http2", "charset", "system-proxy"] }
tauri-plugin-opener = { version = "=2.5.4", optional = true, default-features = false }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }
# Stable handle APIs only; no unstable Windows MetadataExt identity methods.
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming", "Win32_System_SystemServices", "Win32_Security_Authorization", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", default-features = false, features = ["keychain"] }
objc2 = { version = "=0.6.5", optional = true }
objc2-foundation = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "NSObject", "NSGeometry"] }
objc2-app-kit = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSWindow"] }
objc2-web-kit = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "WKWebView", "objc2-app-kit"] }

[build-dependencies]
tauri-build = { version = "=2.7.1", optional = true , features = [] }

[patch.crates-io]
# Official HTTP 2.8.2; pending-body cancellation patch and upstream provenance are kept in vendor/.
tauri-plugin-http = { path = "vendor/tauri-plugin-http" }
