# Pull the published image and serve Momoki on http://localhost:8080
#
#   docker login ghcr.io
#   docker compose pull
#   docker compose up -d
#
# Local image iteration (optional):
#   docker build -t ghcr.io/royians/momoki:latest .

services:
  momoki:
    image: ghcr.io/royians/momoki:latest
    ports:
      - "8080:80"
    restart: unless-stopped
    # The image defines its own HEALTHCHECK (GET /healthz); `docker compose ps` shows healthy/unhealthy.
