server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Container health: answers 200 only while the built app is actually present, so an
    # image with a missing or broken build reports unhealthy instead of serving errors.
    # landing.html is checked because the nginx base image ships its own index.html.
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store";
        if (!-f $document_root/landing.html) {
            return 503;
        }
        return 200 "ok\n";
    }

    # Build metadata (manifest, chunk module report) is not public.
    location /.vite/ {
        return 404;
    }

    # The landing page owns the site root; the SPA keeps every other path.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /landing.html =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
