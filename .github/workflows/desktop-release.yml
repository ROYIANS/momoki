name: Desktop test packages

on:
  push:
    branches: [codex/desktop-release-pipeline]
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.policy.outputs.matrix }}
    steps:
      - name: Preserve identical source bytes across hosts
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.0
      - name: Closed target and source-version policy
        id: policy
        run: node apps/desktop/scripts/prepare-release.mjs

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve identical source bytes across hosts
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.15.0
          dest: ${{ runner.temp }}/momoki-pnpm
          run_install: false
      - name: Pinned stable Rust
        # The shared tool resolver requires rustfmt's path; packaging never runs it.
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --target '${{ matrix.triple }}'
      - name: Deliberate hosted executable resolution
        run: node apps/desktop/scripts/configure-hosted-tools.mjs
      - name: Frozen dependencies
        run: |
          node apps/desktop/scripts/tools.mjs pnpm --dir ../.. install --frozen-lockfile
          node apps/desktop/scripts/tools.mjs pnpm install --frozen-lockfile
      - name: Linux native and media dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf xdg-utils gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav libfuse2
      - name: Fresh normal product installers
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/momoki-release-target
        run: node apps/desktop/scripts/build-release.mjs --target '${{ matrix.target }}' --output "$RUNNER_TEMP/target-package"
      - name: Upload exact packaged target
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, verified 2026-10-12
        with:
          name: desktop-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/target-package
          if-no-files-found: error
          retention-days: 30
      - name: Preserve finite failure diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-diagnostics-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/desktop/.release/builds
          if-no-files-found: warn
          retention-days: 14

  collect:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Preserve identical source bytes across hosts
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.0
      - name: Select immutable current-run artifact IDs
        id: selection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node apps/desktop/scripts/select-release-artifacts.mjs --output "$RUNNER_TEMP/selected-artifacts.json"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7, verified 2026-10-12
        with:
          artifact-ids: ${{ steps.selection.outputs.ids }}
          path: ${{ runner.temp }}/targets
          merge-multiple: false
      - name: Exact source, receipt and payload closure
        run: node apps/desktop/scripts/collect-release.mjs --input "$RUNNER_TEMP/targets" --selection "$RUNNER_TEMP/selected-artifacts.json" --output "$RUNNER_TEMP/release-set"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-set-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-set
          if-no-files-found: error
          retention-days: 30

  draft:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    needs: collect
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Preserve identical source bytes across hosts
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.0
      - name: Select original complete set for a publisher-only retry
        id: release-set
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node apps/desktop/scripts/select-release-artifacts.mjs --kind set --output "$RUNNER_TEMP/selected-set.json"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ steps.release-set.outputs.ids }}
          path: ${{ runner.temp }}/release-set
          merge-multiple: true
      - name: Create or exactly resume an owned draft prerelease
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node apps/desktop/scripts/publish-draft.mjs --directory "$RUNNER_TEMP/release-set"
